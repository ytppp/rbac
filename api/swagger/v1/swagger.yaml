---
openapi: 3.0.1
info:
  title: RBAC API V1
  version: v1
  description: 内容社区与管理后台接口。除标注公开的接口外，均需 Bearer access token。
servers:
- url: http://localhost:3000/api/v1
  description: 本地开发环境
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  "/auth/login":
    post:
      summary: 登录
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: 登录成功，返回 access / refresh token
        '401':
          description: 邮箱或密码错误
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
              - email
              - password
  "/auth/refresh":
    post:
      summary: 刷新 token
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: 换发新的一对 token
        '401':
          description: refresh token 无效
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required:
              - refresh_token
  "/notes":
    get:
      summary: 内容列表
      tags:
      - Notes
      parameters:
      - name: page
        in: query
        required: false
        description: 页码
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: 每页条数
        schema:
          type: integer
      responses:
        '200':
          description: 成功
  "/notes/{id}":
    get:
      summary: 内容详情
      tags:
      - Notes
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: 成功
        '404':
          description: 内容不存在
  "/notes/{id}/reports":
    post:
      summary: 举报内容
      tags:
      - Reports
      security:
      - bearer_auth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '201':
          description: 举报成功
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  enum:
                  - spam
                  - ads
                  - abuse
                  - copyright
                  - other
                detail:
                  type: string
              required:
              - reason
tags: []
