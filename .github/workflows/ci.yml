name: CI

on:
  push:
    branches: [main, feat/content-community]
  pull_request:

jobs:
  api-test:
    name: API 请求测试
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_USER: postgres
      DB_PASSWORD: postgres
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.5'
          bundler-cache: true
          working-directory: api

      - name: 准备测试数据库
        run: bundle exec rails db:create db:schema:load

      - name: 运行请求测试
        run: bundle exec rspec

  app-check:
    name: 前端 Lint 与类型检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: 生成 ESLint 配置与类型声明
        run: npx nuxi prepare

      - name: ESLint
        run: npm run lint

      - name: TypeScript 类型检查
        run: npm run typecheck
